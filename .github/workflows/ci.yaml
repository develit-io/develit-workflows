name: ci-sdk

# Reusable CI (workflow_call) — obaluje `bunx ci-sdk`. Consumer = Nx workspace na Bunu
# s @develit-io/ci-sdk v devDeps. Reference: uses: develit-io/develit-workflows/.github/workflows/ci.yaml@v1
#
# JEDEN job: check (ci-sdk) + build krok. Drivejsi targets+build matrix platila 2 dalsi
# checkout+setup+install (~1 job-min kazdy + per-job billing rounding) — fleet repa maji
# 1-4 build targety, serialni `nx affected/run-many -t build` v jednom jobu je srovnatelne
# rychly a o ~2 joby levnejsi. `ci-sdk build-targets` CLI zustava pro jine konzumenty.
on:
  workflow_call:
    inputs:
      skip-codecheck: { type: boolean, default: false }
      # Override codecheck prikazu (default `bunx biome ci`) - napr. `bun run lint` pro eslint consumery.
      codecheck-command: { type: string, default: '' }
      skip-nx-sync: { type: boolean, default: false }
      skip-wrangler-types: { type: boolean, default: false }
      skip-typecheck: { type: boolean, default: false }
      skip-tests: { type: boolean, default: false }
      # Supply-chain gate: vynuti bunfig [install] minimumReleaseAge >= 172800. Escape hatch pro repa bez bunfigu.
      skip-release-age: { type: boolean, default: false }
      skip-build: { type: boolean, default: false }
      # Affected: jen dotčené projekty (nx affected + nx-set-shas). Jinak run-many (vše).
      affected: { type: boolean, default: false }
      # Pinned (reproducible toolchain; >= 1.3 nutne pro bunfig minimumReleaseAge). Konzument muze prepsat.
      bun-version: { type: string, default: '1.3.12' }
      # Promotion drift guard (PR do těchto větví): base má ne-merge commity, které head nemá = hotfix
      # v prod bez back-merge. Nahrazuje strict required checks (ty na promotion větvi chtějí
      # „Update branch" u každého PR, protože merge commit promotion žije jen na prod). CSV větví.
      promotion-branches: { type: string, default: 'staging,prod,production' }
      # warn = ::warning + summary; fail = job červený (zapnout až po back-merge existujícího driftu)
      promotion-drift: { type: string, default: 'warn' }
    secrets:
      # GH Packages read token pro @develit-io/* private install. Cross-org = per-zakaznik token;
      # nepredano (same-org) -> fallback na caller GITHUB_TOKEN (vyzaduje permissions: packages: read).
      DEVELIT_PACKAGES_TOKEN:
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    # wrangler types umí intermitentně viset (4.110, cryptobyte 07-14: 24 min) — bez limitu GH default 6 h
    timeout-minutes: 15
    # actions:read → nrwl/nx-set-shas dotazuje Actions API (poslední úspěšný run na větvi) na push eventech.
    permissions:
      contents: read
      actions: read
      packages: read # GH Packages pull (@develit-io/*) — job perms jinak přebijí callerův grant → 403
    steps:
      - uses: actions/checkout@v7
        with:
          # Plná historie → nx affected base/head + nx-set-shas.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # compare head...base = commity jen v base; 1 parent = skutečný commit (merge commity promotion
      # z minula mají 2 rodiče a nejsou drift). GET jen na vlastním repu → stačí contents: read.
      - name: Promotion drift
        if: ${{ github.event_name == 'pull_request' && contains(format(',{0},', inputs.promotion-branches), format(',{0},', github.base_ref)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          MODE: ${{ inputs.promotion-drift }}
        run: |
          drift=$(gh api "repos/${{ github.repository }}/compare/$HEAD...$BASE" \
            --jq '[.commits[] | select(.parents | length == 1) | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"] | .[]')
          if [ -z "$drift" ]; then
            echo "promotion drift: $BASE nemá commity mimo $HEAD"
            exit 0
          fi
          n=$(printf '%s\n' "$drift" | wc -l | tr -d ' ')
          {
            echo "### Promotion drift: \`$BASE\` má $n commit(ů) mimo \`$HEAD\`"
            echo "Nejdřív back-merge \`$BASE\` → \`$HEAD\` (jinak se hotfixy z $BASE ztratí)."
            echo '```'
            printf '%s\n' "$drift"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "fail" ]; then
            echo "::error::promotion drift: $BASE má $n commit(ů) mimo $HEAD — back-merge nejdřív"
            exit 1
          fi
          echo "::warning::promotion drift: $BASE má $n commit(ů) mimo $HEAD — back-merge doporučen"

      # Bez restore-keys — viz fleet-dashboard.yaml (snowball: restore starého supersetu je dražší než cold install)
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        env:
          DEVELIT_PACKAGES_TOKEN: ${{ secrets.DEVELIT_PACKAGES_TOKEN || github.token }}

      # Nastaví NX_BASE / NX_HEAD pro nx affected (PR: merge-base; push: poslední úspěšný commit).
      - uses: nrwl/nx-set-shas@v5

      - name: ci-sdk check
        env:
          AFFECTED: ${{ inputs.affected }}
          SKIP_CODECHECK: ${{ inputs.skip-codecheck }}
          CODECHECK_CMD: ${{ inputs.codecheck-command }}
          SKIP_NX_SYNC: ${{ inputs.skip-nx-sync }}
          SKIP_WRANGLER_TYPES: ${{ inputs.skip-wrangler-types }}
          SKIP_TYPECHECK: ${{ inputs.skip-typecheck }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
          SKIP_RELEASE_AGE: ${{ inputs.skip-release-age }}
        run: |
          args=()
          [ "$AFFECTED" = "true" ] && args+=(--affected)
          [ "$SKIP_CODECHECK" = "true" ] && args+=(--skip-codecheck)
          [ -n "$CODECHECK_CMD" ] && args+=(--codecheck-cmd "$CODECHECK_CMD")
          [ "$SKIP_NX_SYNC" = "true" ] && args+=(--skip-nx-sync)
          [ "$SKIP_WRANGLER_TYPES" = "true" ] && args+=(--skip-wrangler-types)
          [ "$SKIP_TYPECHECK" = "true" ] && args+=(--skip-typecheck)
          [ "$SKIP_TESTS" = "true" ] && args+=(--skip-tests)
          [ "$SKIP_RELEASE_AGE" = "true" ] && args+=(--skip-release-age)
          bunx ci-sdk check "${args[@]}"

      # Build ve stejnem jobu (sdileny install; nx affected respektuje NX_BASE/NX_HEAD
      # z nx-set-shas vyse). Projekty bez build targetu nx tise preskoci.
      - name: Build
        if: ${{ !inputs.skip-build }}
        env:
          AFFECTED: ${{ inputs.affected }}
        run: |
          if [ "$AFFECTED" = "true" ]; then
            bunx nx affected -t build
          else
            bunx nx run-many -t build
          fi
