name: deploy-sdk gc-previews

# Reusable orphan GC (workflow_call) — obaluje `bunx deploy-sdk gc`. Smaze per-PR zdroje ZAVRENYCH PR
# (close-cleanup se nespustil / smazana branch / zavod). Otevrene PR se NIKDY nemazou (zadny TTL).
# apply pocita caller: cron = vzdy apply, dispatch = podle checkboxu. Consumer dodá tenký wrapper:
#
#   on:
#     schedule: [{ cron: '0 3 * * 1' }]   # pondeli 03:00 UTC
#     workflow_dispatch: { inputs: { apply: { type: boolean, default: false } } }
#   concurrency: { group: gc-previews, cancel-in-progress: false }
#   jobs:
#     gc:
#       uses: develit-io/develit-workflows/.github/workflows/gc-previews.yaml@v1
#       permissions: { contents: read, pull-requests: read, packages: read }
#       secrets: inherit
#       with:
#         apply: ${{ github.event_name == 'schedule' || inputs.apply }}
#
# Cross-org consumer (inherit GH nepodporuje mimo org) preda secrets explicitne:
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#         CLOUDFLARE_API_TOKENS: ${{ secrets.CLOUDFLARE_API_TOKENS }}  # multi-account (misto CLOUDFLARE_API_TOKEN)
#         DEVELIT_PACKAGES_TOKEN: ${{ secrets.DEVELIT_PACKAGES_TOKEN }}  # GH Packages read (@develit-io/*)
on:
  workflow_call:
    inputs:
      apply: { type: boolean, default: false } # true = realne mazat (jinak dry-run)
      bun-version: { type: string, default: '1.3.12' }
    secrets:
      # Single-account: ambient token (org secret). Multi-account: misto nej CLOUDFLARE_API_TOKENS (nize);
      # krok "CF tokens" fail-fastne, kdyz chybi oba.
      CLOUDFLARE_API_TOKEN: { required: false }
      # Multi-account: 1-line JSON {"dev":"<tok>","staging":"<tok>","prod":"<tok>"} — hodnota = CF API token
      # uctu daneho env (accountId deklaruje topology.environments.<env>.accountId). staging prazdne = env
      # neni; preview + gc berou dev. NE viceradkovy (rozbiji redakci job outputs). Cross-org preda explicitne.
      CLOUDFLARE_API_TOKENS: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: true }
      # GH Packages read token pro @develit-io/* private install. Nepredano (same-org) -> fallback
      # na caller GITHUB_TOKEN; cross-org preda per-zakaznik token.
      DEVELIT_PACKAGES_TOKEN: { required: false }

jobs:
  gc:
    runs-on: ubuntu-latest
    # orphan sweep — strop proti stuck runu
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      packages: read # install privatniho @develit-io/* (same-org fallback na GITHUB_TOKEN)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GC_APPLY: ${{ inputs.apply && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      # Multi-account: CLOUDFLARE_API_TOKENS (1-line JSON {dev,staging,prod} → token) → per-env
      # CLOUDFLARE_API_TOKEN_<ENV> do env; SDK je bere prednostne pred ambient tokenem (preview + gc → dev,
      # production → prod). Hodnoty se maskuji. Bez JSON musi existovat ambient CLOUDFLARE_API_TOKEN.
      - name: CF tokens (per-env)
        env:
          TOKENS_JSON: ${{ secrets.CLOUDFLARE_API_TOKENS }}
          AMBIENT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKENS_JSON" ]; then
            [ -n "$AMBIENT_TOKEN" ] || { echo "::error::chybí CLOUDFLARE_API_TOKEN i CLOUDFLARE_API_TOKENS (cross-org: předat explicitně, viz header)"; exit 1; }
            exit 0
          fi
          [ "$(printf '%s' "$TOKENS_JSON" | wc -l)" -eq 0 ] || { echo "::error::CLOUDFLARE_API_TOKENS musí být 1-line JSON (víceřádkový secret rozbíjí redakci job outputs)"; exit 1; }
          printf '%s' "$TOKENS_JSON" | jq -e 'type=="object" and all(.[]; type=="string")' >/dev/null || { echo "::error::CLOUDFLARE_API_TOKENS není JSON objekt {env: token}"; exit 1; }
          for k in $(printf '%s' "$TOKENS_JSON" | jq -r 'keys[]'); do
            v=$(printf '%s' "$TOKENS_JSON" | jq -r --arg k "$k" '.[$k]')
            [ -n "$v" ] || continue
            case "$k" in dev|staging|prod) ;; *) echo "::warning::CLOUDFLARE_API_TOKENS: neznámý klíč '$k' (konvence dev|staging|prod)";; esac
            echo "::add-mask::$v"
            printf '%s<<__EOF__\n%s\n__EOF__\n' "CLOUDFLARE_API_TOKEN_$(printf '%s' "$k" | tr '[:lower:]-' '[:upper:]_')" "$v" >> "$GITHUB_ENV"
          done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      # Bez restore-keys — viz fleet-dashboard.yaml (snowball: restore starého supersetu je dražší než cold install)
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          DEVELIT_PACKAGES_TOKEN: ${{ secrets.DEVELIT_PACKAGES_TOKEN || github.token }}
      # package je gh-free → cisla otevrenych PR dodame z gh pres --open-prs
      - run: |
          OPEN=$(gh pr list --state open --json number --jq '[.[].number] | join(",")')
          bunx deploy-sdk gc --open-prs "$OPEN"
